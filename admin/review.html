<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка каталога · XPMED</title><style>
@font-face{font-family:Jost;src:url('/assets/jost-cyrillic.woff2') format('woff2');font-weight:100 900;unicode-range:U+0400-052F}@font-face{font-family:Jost;src:url('/assets/jost-latin.woff2') format('woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#eef0f2;color:#003242;font:16px Jost,Arial,sans-serif}header{padding:16px 24px;background:white;border-bottom:1px solid #ccd5d9;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:24px;font-weight:300;margin:0}select,button,textarea{font:inherit}select{max-width:min(440px,100%);min-width:0;padding:10px}header>select{flex:1}#lang{width:64px}.flags{overflow-wrap:anywhere}button{border:1px solid #076cec;border-radius:32px;padding:10px 20px;background:white;color:#003242;cursor:pointer}button:hover{background:#e0edf9}button:disabled{opacity:.5;cursor:default}.bar{display:flex;gap:8px;padding:12px 24px;flex-wrap:wrap}.workspace{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 195px);gap:8px;padding:0 16px 16px}.pane{min-width:0;overflow:auto;background:white;border:1px solid #ccd5d9}iframe{width:100%;height:100%;border:0}.original{padding:12px}.original img{width:100%;display:block;margin-bottom:16px}.original a{color:#076cec}.flags{background:#fff2a6;padding:12px;margin-bottom:12px}.flags ul{padding-left:20px}textarea{width:100%;height:75vh;padding:20px;line-height:1.5;font:14px monospace}#editor{display:none;padding:0 24px}#status{padding:0 24px;min-height:24px;color:#076cec}.pane h2{font-size:18px;font-weight:400}label{display:flex;gap:6px;align-items:center}@media(max-width:800px){.workspace{grid-template-columns:minmax(0,1fr);height:auto}.pane{height:65vh}.original{height:auto}header{padding:12px}}
.source-page{position:relative;margin-bottom:20px;scroll-margin-top:16px}.source-page img{margin-bottom:0;height:auto}.source-box{position:absolute;border:3px solid #e3aa12;background:#ffdf5030;pointer-events:none;z-index:2}.source-box[hidden]{display:none}.source-position{font-size:13px;color:#076cec;margin:6px 0 18px}.source-jump{display:block;padding:4px 10px;margin:6px 0;font-size:13px;border-color:#bba436;border-radius:3px;text-align:left}.source-item{display:block;width:100%;text-align:left;font-size:13px;padding:8px 10px;margin:4px 0;border-radius:3px;overflow-wrap:anywhere}.source-item.flagged{background:#fff2a6}
</style><header><h1>XPMED · Проверка каталога</h1><select id="systems" aria-label="Черновики"></select><label><input id="show-skipped" type="checkbox">Пропущенные</label><label>Язык <select id="lang"><option value="ru">RU</option><option value="en">EN</option></select></label></header><div class="bar"><button id="publish">Опубликовать</button><button id="edit">Редактировать JSON</button><button id="skip">Пропустить</button><button id="reload">Обновить</button></div><p id="status" role="status"></p><div id="editor"><p>Поля с замечаниями указаны жёлтым в списке справа. Статус меняется только кнопкой публикации.</p><textarea id="json" spellcheck="false" aria-label="JSON системы"></textarea><button id="save">Сохранить черновик</button><button id="cancel">Отмена</button></div><main class="workspace"><section class="pane"><iframe id="preview" title="Предпросмотр системы" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe></section><aside class="pane original"><div id="flags" class="flags"></div><div id="sources"></div></aside></main><script>
const token='__REVIEW_TOKEN__';let current,revision,all=[];const $=id=>document.getElementById(id);const status=text=>$('status').textContent=text;
function showSource(record){
 const page=Number(record.pdfPage||record.sourcePages?.[0]);const wrapper=document.getElementById('source-page-'+page);if(!wrapper)return;
 document.querySelectorAll('.source-box').forEach(box=>box.hidden=true);
 const b=record.sourceBounds;
 if(Array.isArray(b)&&b.length===4&&b.every(Number.isFinite)&&b[0]>=0&&b[1]>=0&&b[2]<=1&&b[3]<=1){const box=wrapper.querySelector('.source-box');box.style.left=b[0]*100+'%';box.style.top=b[1]*100+'%';box.style.width=Math.max(0,b[2]-b[0])*100+'%';box.style.height=Math.max(0,b[3]-b[1])*100+'%';box.hidden=false;}
 wrapper.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
 status('Источник: страница PDF '+page+(page>=4&&page<=16?' · печатная '+(page-2):'')+(record.path?' · '+record.path:''));
}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==$('preview').contentWindow||event.data?.type!=='xpmed-source')return;showSource(event.data);});

async function api(url,body){const response=await fetch('/admin/api/'+url,body?{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)}:{});const data=await response.json();if(!response.ok)throw Error(data.error||'Ошибка');return data}
async function refresh(){try{all=await api('systems');const id=$('systems').value||new URLSearchParams(location.search).get('system');$('systems').replaceChildren();for(const x of all.filter(x=>!x.skipped||$('show-skipped').checked)){const o=new Option((x.skipped?'[Пропущено] ':'')+x.name.ru+' · '+x.flags.length+' замеч.',x.id);$('systems').add(o)}if([...$('systems').options].some(o=>o.value===id))$('systems').value=id;await load()}catch(e){status(e.message)}}
async function load(){try{const id=$('systems').value;for(const x of ['publish','edit','skip'])$(x).disabled=!id;if(!id){current=null;$('preview').src='about:blank';$('sources').replaceChildren();$('flags').textContent='Черновиков нет';status('Все системы обработаны');return}const data=await api('system?id='+encodeURIComponent(id));current=data.system;revision=data.version;$('preview').src='/admin/preview?id='+encodeURIComponent(id)+'&lang='+$('lang').value+'&v='+Date.now();$('sources').replaceChildren();$('flags').replaceChildren();const heading=document.createElement('strong');heading.textContent='Поля для проверки';$('flags').append(heading);const list=document.createElement('ul');for(const f of current.review?.flags||[]){const li=document.createElement('li');const code=document.createElement('code');code.textContent=f.path;li.append(code,document.createTextNode(': '+(f.message.ru||f.message.en)));if(f.pdfPage||f.sourcePages?.length){const jump=document.createElement('button');jump.className='source-jump';jump.textContent='Показать на странице PDF '+(f.pdfPage||f.sourcePages[0]);jump.onclick=()=>showSource(f);li.append(jump)}list.append(li)}$('flags').append(list);const translated=current.review?.translatedFields||[];if(translated.length){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Переведённые поля для медицинской проверки: '+translated.length;details.append(summary);const fieldList=document.createElement('ul');for(const path of translated){const li=document.createElement('li');li.textContent=path;fieldList.append(li)}details.append(fieldList);$('flags').append(details)}if(!(current.review?.flags||[]).length)$('flags').append(' — нет');const pdf=document.createElement('a');pdf.href=current.sourcePdf;pdf.textContent='Открыть исходный PDF';pdf.target='_blank';$('sources').append(pdf);const items=document.createElement('details');const itemSummary=document.createElement('summary');itemSummary.textContent='Позиции каталога с координатами: '+(current.components||[]).filter(c=>c.sourceBounds).length;items.append(itemSummary);for(const [index,component]of(current.components||[]).entries()){if(!component.sourceBounds)continue;const button=document.createElement('button');button.className='source-item'+(component.codeEvidence?.some(e=>e.flagged)?' flagged':'');button.textContent=(component.name[$('lang').value]||component.name.en)+' · '+(component.refCodes?.join(' / ')||'код требует проверки');button.onclick=()=>showSource({...component,path:'components.'+index});items.append(button)}$('flags').append(items);for(const [i,src]of(current.sourcePageImages||[]).entries()){const label=document.createElement('h2');label.textContent='Страница PDF '+current.sourcePages[i];const wrapper=document.createElement('div');wrapper.className='source-page';wrapper.id='source-page-'+current.sourcePages[i];const img=document.createElement('img');img.src=src;img.alt=label.textContent;img.loading='lazy';img.decoding='async';const dimensions=current.sourcePageDimensions?.[current.sourcePages[i]];if(dimensions){img.width=dimensions.width;img.height=dimensions.height;}const a=document.createElement('a');a.href=src;a.target='_blank';a.append(img);const box=document.createElement('div');box.className='source-box';box.hidden=true;wrapper.append(a,box);$('sources').append(label,wrapper)}status('Черновик · '+(current.review?.flags||[]).length+' замечаний')}catch(e){status(e.message)}}
$('systems').onchange=load;$('lang').onchange=load;$('reload').onclick=refresh;$('show-skipped').onchange=refresh;
$('edit').onclick=()=>{$('json').value=JSON.stringify(current,null,2);$('editor').style.display='block';document.querySelector('.workspace').style.display='none'};
$('cancel').onclick=()=>{$('editor').style.display='none';document.querySelector('.workspace').style.display='grid'};
$('save').onclick=async()=>{try{const s=JSON.parse($('json').value);await api('save',{id:$('systems').value,version:revision,system:s});$('cancel').click();await refresh();status('Черновик сохранён')}catch(e){status(e.message)}};
$('skip').onclick=async()=>{try{await api('skip',{id:$('systems').value,version:revision});await refresh()}catch(e){status(e.message)}};
$('publish').onclick=async()=>{const count=current.review?.flags?.length||0;if(!confirm('Опубликовать систему в локальной сборке? '+(count?'Подтвердите проверку '+count+' отмеченных полей.':'')))return;try{$('publish').disabled=true;status('Публикация и сборка…');await api('publish',{id:$('systems').value,version:revision,acknowledgeFlags:true});await refresh();status('Система опубликована в локальной сборке')}catch(e){status(e.message);$('publish').disabled=false}};refresh();
</script></html>
